name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      # Ship the exact artifacts that passed both platform jobs on main. A tag
      # without a successful main build fails before creating a public release.
      - name: Download verified build artifacts
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
            -f head_sha="$source_commit" -f branch=main -f event=push \
            -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo '::error::This tag has no successful Build App run on main. Wait for CI before tagging.'
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name Asspp.ipa --name Asspp.zip --name Asspp-sources \
            --dir "${RUNNER_TEMP}/verified-build"
          mkdir -p "${RUNNER_TEMP}/release"
          cp "${RUNNER_TEMP}/verified-build/Asspp.ipa/Asspp.ipa" "${RUNNER_TEMP}/release/"
          cp "${RUNNER_TEMP}/verified-build/Asspp.zip/Asspp.zip" "${RUNNER_TEMP}/release/"
          cp "${RUNNER_TEMP}/verified-build/Asspp-sources/Asspp-sources.tar.gz" "${RUNNER_TEMP}/release/"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "BUILD_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Validate release identity and corresponding source
        run: |
          set -euo pipefail
          python3 Resources/Scripts/validate-release.py "${RUNNER_TEMP}/release" \
            --tag "$GITHUB_REF_NAME" --commit "$SOURCE_COMMIT"
          version="${GITHUB_REF_NAME#v}"
          cp "Resources/ReleaseNotes/${version}.md" "${RUNNER_TEMP}/release-notes.md"
          printf '\nBuild verification: https://github.com/%s/actions/runs/%s\nSource commit: %s\n' \
            "$GITHUB_REPOSITORY" "$BUILD_RUN_ID" "$SOURCE_COMMIT" >> "${RUNNER_TEMP}/release-notes.md"

      - name: Upload and publish release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo '::error::Refusing to overwrite an already published release.'
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Asspp ${GITHUB_REF_NAME#v}" --draft \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "${RUNNER_TEMP}/release/Asspp.ipa" \
            "${RUNNER_TEMP}/release/Asspp.zip" \
            "${RUNNER_TEMP}/release/Asspp-sources.tar.gz" \
            "${RUNNER_TEMP}/release/SHA256SUMS" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Asspp ${GITHUB_REF_NAME#v}" --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --draft=false --latest
